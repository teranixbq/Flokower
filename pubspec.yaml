name: flokower
description: Flokower - Mobile inventory and sales management for UMKM florists
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  
  # Firebase Core & Auth
  firebase_core: ^2.24.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.14.0
  
  # Image
  image_picker: ^1.0.7
  
  # Cloudflare R2 (S3 API) upload
  crypto: ^3.0.7
  http: ^1.6.0
  
  # UI Components
  google_fonts: ^6.1.0
  intl: ^0.18.0
  shimmer: ^2.0.0
  
  # Utilities
  uuid: ^4.2.1
  shared_preferences: ^2.2.0
  flutter_dotenv: ^5.1.0
  
  # Charts (Optional)
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^2.3.0
  build_runner: ^2.4.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
